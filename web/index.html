<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Surface colors from src/theme/tokens.css -->
    <meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)" />
    <title>Venue Lost &amp; Found</title>
    <script>
      // Apply the saved theme before first paint (key matches THEME_STORAGE_KEY in src/components/ThemeToggle.tsx).
      try {
        var t = localStorage.getItem('vlf-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          // Explicit theme: an unscoped theme-color ahead of the media ones (ThemeToggle keeps it in sync).
          var m = document.createElement('meta');
          m.name = 'theme-color';
          m.content = t === 'dark' ? '#121318' : '#faf8ff';
          m.setAttribute('data-explicit', '');
          document.head.insertBefore(m, document.head.querySelector('meta[name="theme-color"]'));
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
